name: docs
on:
  push:
    branches:
      - develop
      - main
    paths:
      # Only rebuild website when docs have changed
      - 'README.md'
      - 'docs/**'
      - 'mkdocs.yml'
      - .github/**

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v2

      - name: Set up Python 3.x
        uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
      - name: Build and deploy documentation
        run: >-
          uv tool run --constraints security/python-constraints.txt
          --with mkdocs-mermaid2-plugin --with mkdocs-jupyter
          --from mkdocs-material mkdocs gh-deploy --force
