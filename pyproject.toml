[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "application-context-hub"
version = "1.6.0"
description = "application-context-hub"
authors = [{ name = "Terradue", email = "fabrice.brito@terradue.com" }]
license = { text = "EUPL" }
requires-python = ">=3.10"
dependencies = [
    "kubernetes==31.0.0",
    "loguru==0.7.2",
    "psycopg2==2.9.10",
    "Jinja2==3.1.6",
    "Mako==1.4.2",
    "PyJWT==2.15.0",
    "idna==3.15",
    "jupyterhub==5.5.0",
    "jupyterhub-ltiauthenticator==1.6.3",
    "oauthlib==4.0.0",
    "requests==2.33.0",
    "PyYAML==6.0.2",
    "pydantic==2.9.2",
]

[project.urls]
Homepage = "https://github.com/EOEPCA/application-hub-context.git"

[tool.hatch.build.targets.wheel]
packages = ["application_hub_context"]

[tool.hatch.envs.default]
installer = "uv"

[tool.hatch.envs.hatch-uv]
dependencies = ["uv>=0.13.4"]

[tool.hatch.envs.dev]
dependencies = ["addict==2.4.0"]

[tool.hatch.envs.dev.scripts]
test = "python -m unittest discover -s tests -p 'tests_*.py' -v {args}"
